services:
  # ============================================================
  # Backend server — Pi Realm game server
  # Dev mode with hot reload via tsx watch
  # ============================================================
  server:
    build:
      context: .
      target: dev
    container_name: pi-realm-server
    ports:
      - '3001:3001'
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      # Persistent data
      - pi-realm-data:/app/data
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOST=0.0.0.0
    restart: unless-stopped
    # tsx watch restarts automatically when src/ files change
    command: ['tsx', 'watch', 'src/server.ts']
    # Health check
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3001/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================
  # Dashboard — React admin UI with hot reload via Vite HMR
  # ============================================================
  dashboard:
    image: node:22-alpine
    container_name: pi-realm-dashboard
    ports:
      - '5173:5173'
    working_dir: /app
    command: >
      sh -c "npm install --ignore-scripts && npx vite --host 0.0.0.0 --port 5173"
    volumes:
      - ./dashboard:/app
      # Exclude node_modules from host to use container's
      - node_modules_dashboard:/app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pi-realm-data:
  node_modules_dashboard:
